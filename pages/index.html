<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSEO Pages Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e5e5e5;padding:24px 0;position:sticky;top:0;z-index:10}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.header h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.header h1 span{color:#0071e3}
.stats{font-size:14px;color:#707070}
.search-bar{max-width:1200px;margin:24px auto 0;padding:0 24px}
.search-bar input{width:100%;padding:12px 20px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;outline:none;transition:border .2s,box-shadow .2s;background:#fff}
.search-bar input:focus{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.filters{max-width:1200px;margin:16px auto 0;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{padding:6px 16px;border:1px solid #d2d2d7;border-radius:999px;font-size:13px;background:#fff;cursor:pointer;transition:all .2s;color:#1d1d1f}
.filter-btn:hover{border-color:#0071e3;color:#0071e3}
.filter-btn.active{background:#0071e3;color:#fff;border-color:#0071e3}
.grid{max-width:1200px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:1fr;gap:16px}
.card{background:#fff;border-radius:16px;border:1px solid #e5e5e5;overflow:hidden;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08)}
.card-top{padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.card-info{flex:1;min-width:0}
.card-title{font-size:18px;font-weight:600;letter-spacing:-.2px;margin-bottom:4px;cursor:pointer;transition:color .2s;display:inline-block}
.card-title:hover{color:#0071e3}
.card-meta-title{font-size:13px;color:#707070;margin-bottom:6px;cursor:pointer;transition:color .2s;display:inline-block}
.card-meta-title:hover{color:#0071e3}
.card-desc{font-size:14px;color:#707070;line-height:1.5}
.card-file{font-size:12px;color:#999;font-family:'SF Mono',SFMono-Regular,Consolas,monospace;margin-top:6px}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
.badge-education{background:rgba(52,199,89,.1);color:#34c759}
.badge-productivity{background:rgba(0,113,227,.1);color:#0071e3}
.badge-e-commerce{background:rgba(255,149,0,.1);color:#ff9500}
.badge-website{background:rgba(88,86,214,.1);color:#5856d6}
.badge-tools{background:rgba(255,45,85,.1);color:#ff2d55}
.badge-games{background:rgba(175,82,222,.1);color:#af52de}
.card-actions{padding:0 24px 16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#0071e3;color:#fff}
.btn-primary:hover{background:#0077ed}
.btn-secondary{background:#f5f5f7;color:#1d1d1f;border:1px solid #d2d2d7}
.btn-secondary:hover{background:#e8e8ed}
.btn svg{width:14px;height:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#1d1d1f;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:all .3s ease;z-index:100;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.empty{text-align:center;padding:80px 24px;color:#707070;font-size:16px}
@media(max-width:640px){
  .header-inner{flex-direction:column;align-items:flex-start}
  .card-top{flex-direction:column}
  .card-actions{flex-direction:column}
  .btn{justify-content:center}
}
</style>
</head>
<body>

    <h1><span>PSEO</span> Pages Manager</h1>

  </div>

<div class="search-bar">

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">No templates found.</div>

];

const catColors={Education:'education',Productivity:'productivity','E-commerce':'e-commerce',Website:'website',Tools:'tools',Games:'games'};
const grid=document.getElementById('grid');
const empty=document.getElementById('empty');
const search=document.getElementById('search');
const filters=document.getElementById('filters');
const stats=document.getElementById('stats');
let activeFilter='All';

const cats=['All',...[...new Set(pages.map(p=>p.c))]].sort((a,b)=>a==='All'?-1:b==='All'?1:a.localeCompare(b));
stats.textContent=pages.length+' templates';

cats.forEach(c=>{
  const btn=document.createElement('button');
  btn.className='filter-btn'+(c==='All'?' active':'');
  btn.textContent=c;
  btn.onclick=()=>{
    activeFilter=c;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
  filters.appendChild(btn);
});

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function copyText(text,label){
  navigator.clipboard.writeText(text).then(()=>toast(label+' copied!')).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(label+' copied!');
  });
}

function copyHTML(idx){
  const html=atob(pages[idx].h);
  copyText(html,'HTML code');
}

function render(){
  const q=search.value.toLowerCase();
  grid.innerHTML='';
  let count=0;
  pages.forEach((p,i)=>{
    if(activeFilter!=='All'&&p.c!==activeFilter)return;
    if(q&&!p.t.toLowerCase().includes(q)&&!p.d.toLowerCase().includes(q)&&!p.f.toLowerCase().includes(q)&&!p.c.toLowerCase().includes(q))return;
    count++;
    const card=document.createElement('div');
    card.className='card';
    const badgeClass=catColors[p.c]||'website';
    card.innerHTML=`
      <div class="card-top">
        <div class="card-info">
          <div class="card-title" onclick="copyText('${p.t.replace(/'/g,"\\'")}','Page Title')" title="Click to copy title">${p.t}</div>
          <div class="card-meta-title" onclick="copyText('${p.m.replace(/'/g,"\\'")}','Meta Title')" title="Click to copy meta title">${p.m}</div>
          <div class="card-desc">${p.d}</div>
          <div class="card-file">${p.f}</div>
        </div>
        <span class="badge badge-${badgeClass}">${p.c}</span>
      </div>
      <div class="card-actions">
        <button class="btn btn-primary" onclick="copyHTML(${i})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
          Copy HTML Code
        </button>
        <button class="btn btn-secondary" onclick="copyText('${p.t.replace(/'/g,"\\'")}','Page Title')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4a2 2 0 0 1 2-2h8.5L20 7.5V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/><polyline points="14 2 14 8 20 8"/><line x1="2" y1="13" x2="12" y2="13"/><polyline points="9 10 12 13 9 16"/></svg>
          Copy Title
        </button>
        <button class="btn btn-secondary" onclick="copyText('${p.m.replace(/'/g,"\\'")}','Meta Title')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Copy Meta Title
        </button>
        <button class="btn btn-secondary" onclick="copyText('${p.d.replace(/'/g,"\\'")}','Meta Description')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
          Copy Description
        </button>
      </div>`;
    grid.appendChild(card);
  });
  empty.style.display=count===0?'block':'none';
}

search.addEventListener('input',render);
render();
</script>
</body>
</html>
